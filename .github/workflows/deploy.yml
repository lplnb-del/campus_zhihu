name: Deploy CampusZhihu to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限以允许发布到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 允许并发部署控制：若新的提交触发发布，自动取消正在进行的旧部署任务
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend

      - name: Build production bundle (mock mode)
        run: pnpm run build:mock
        working-directory: ./frontend

      - name: Prepare SPA routing (404.html) & .nojekyll
        run: |
          cp frontend/dist/index.html frontend/dist/404.html
          touch frontend/dist/.nojekyll

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
